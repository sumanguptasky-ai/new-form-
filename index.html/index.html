<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Portal Submit Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Card Wrapper -->
    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Form Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold mb-1">Classroom Registration</h1>
            <p class="text-slate-400 text-sm">Fill in your details to submit your meeting access request.</p>
        </div>

        <!-- Submission Form -->
      
          <form action="https://formspree.io/f/xljjkzry" method="post">
            
            <!-- Name Field -->
            <div>
                <label for="fullName" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="fullName" required placeholder="John Doe" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white text-sm">
                </div>
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required placeholder="student@school.edu" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white text-sm">
                </div>
            </div>

            <!-- Class / Meeting Code Field -->
            <div>
                <label for="classCode" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Class / Meeting Code</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="text" id="classCode" required placeholder="e.g. MATH-101" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-white text-sm font-mono uppercase tracking-wider">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 transition-colors py-3 rounded-lg font-semibold text-sm shadow-lg flex items-center justify-center space-x-2">
                <span>Submit Details</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>

        <!-- Success Message Container (Hidden by default) -->
        <div id="successView" class="hidden text-center py-6">
            <div class="w-16 h-16 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/30">
                <i class="fa-solid fa-check text-2xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">Submission Successful!</h2>
            <p id="summaryText" class="text-slate-400 text-sm mb-6"></p>
            <button onclick="resetForm()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-lg text-sm font-medium transition-colors">
                Submit Another Request
            </button>
        </div>

    </div>

    <!-- JavaScript Handler -->
    <script>
        function handleSubmit(event) {
            event.preventDefault();

            // Fetch input values
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const code = document.getElementById('classCode').value;

            // UI Transition
            const form = document.getElementById('submissionForm');
            const successView = document.getElementById('successView');
            const summaryText = document.getElementById('summaryText');

            summaryText.textContent = `Welcome ${name}. Access code (${code.toUpperCase()}) confirmed for ${email}.`;
            
            form.classList.add('hidden');
            successView.classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('submissionForm').reset();
            document.getElementById('successView').classList.add('hidden');
            document.getElementById('submissionForm').classList.remove('hidden');
        }
    </script>
</body>
</html>
