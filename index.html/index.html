<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Interest Form</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .checkbox-group, .radio-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .checkbox-group label, .radio-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    @media (max-width: 480px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Student Registration Form</h2>
    <form action="#" method="POST">
      
      <!-- Personal Details -->
      <div class="grid-2">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="98XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" required>
        </div>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
      </div>

      <!-- Academic Stream -->
      <div class="grid-2">
        <div class="form-group">
          <label for="grade">Grade / Class</label>
          <select id="grade" name="grade" required>
            <option value="" disabled selected>Select Grade</option>
            <option value="Class 11">Class 11</option>
            <option value="Class 12">Class 12</option>
            <option value="Bachelors">Bachelors</option>
          </select>
        </div>

        <div class="form-group">
          <label for="stream">Academic Stream</label>
          <select id="stream" name="stream" required>
            <option value="" disabled selected>Select Stream</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Management">Management</option>
            <option value="Science">Science</option>
            <option value="Humanities">Humanities</option>
          </select>
        </div>
      </div>

      <!-- Areas of Interest -->
      <div class="form-group">
        <label>Areas of Interest</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="interest" value="Web Development"> Web Development</label>
          <label><input type="checkbox" name="interest" value="Programming"> Programming</label>
          <label><input type="checkbox" name="interest" value="Economics"> Economics</label>
          <label><input type="checkbox" name="interest" value="Sports"> Sports</label>
        </div>
      </div>

      <!-- Additional Notes -->
      <div class="form-group">
        <label for="comments">Additional Notes / Bio</label>
        <textarea id="comments" name="comments" rows="3" placeholder="Tell us a little about yourself..."></textarea>
      </div>

      <button type="submit">Submit Registration</button>
    </form>
  </div>

</body>
</html>
